name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Mypy type-check
        run: mypy src

      - name: Run tests
        run: python -m pytest -v

  annotator-ui:
    name: Annotator UI (web/annotator-ui)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/annotator-ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/annotator-ui/package-lock.json

      - name: Install JS deps
        run: npm ci

      - name: Run Vitest
        run: npm test -- --run

      - name: Build Rollup bundle
        run: npm run build
